name: Build Android APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Calculate 4-Digit Build Number
      id: build_num
      run: |
        BUILD_NO=$((1000 + GITHUB_RUN_NUMBER))
        echo "BUILD_NUMBER=$BUILD_NO" >> $GITHUB_ENV
        echo "BUILD_TAG=v1.0.0.$BUILD_NO" >> $GITHUB_ENV

    - name: Run Unit Tests
      run: gradle test
      env:
        BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

    - name: Build Debug APK
      run: gradle assembleDebug
      env:
        BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: paging-dr-howard-debug-apk-${{ env.BUILD_NUMBER }}
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release on Green
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.BUILD_TAG }}
        name: "Paging Dr. Howard ${{ env.BUILD_TAG }} Release 📟"
        body: |
          ### Paging Dr. Howard ${{ env.BUILD_TAG }} 📟🔐
          Automated Release compiled on green CI test pass.
          
          **Features**:
          - Multi-Level Paging: (1) Hey look! and (2) SOS Emergency
          - Bidirectional Family Phone Pairing & Address Book
          - DND & Silent Mode Override via USAGE_ALARM
          - ECDH & ECDSA Public/Private Key Cryptography per pairing
          - 4-Digit Versioning System (`${{ env.BUILD_TAG }}`)
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
